[project]
name = "pyr4t"
version = "1.1.0"
description = "A CLI app for generating and managing python projects."
authors = [{ name = "R4tL", email = "r4tl.dev@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "requests~=2.32",
  "keyring~=25.7",
  "pytest~=8.4",
  "black~=24.10",
  "isort~=5.13",
  "build~=1.3",
  "secretstorage~=3.3; sys_platform == 'linux'",
  "jeepney~=0.8; sys_platform == 'linux'",
  "keyrings.alt~=5.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "black>=24.3.0", "isort>=5.13.2"]

[project.scripts]
pyr4t-test = "pyr4t.launcher:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyr4t.cli" = ["commands.json"]
