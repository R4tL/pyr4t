[project]
name = "pyr4t"
version = "0.2.1"
description = ""
authors = [{ name = "R4tL", email = "r4tl.dev@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.0.0,<3.0.0",
    "keyring>=24.0.0,<25.0.0",
    "pytest>=8.3.2,<9.0.0",
    "black>=24.3.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "black>=24.3.0", "isort>=5.13.2"]

[project.scripts]
pyr4t = "pyr4t.luncher:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyr4t.cli" = ["commands.json"]
